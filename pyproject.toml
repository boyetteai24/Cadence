[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-dictation"
version = "0.2.0"
description = "System-wide, local-first voice dictation for Windows (faster-whisper + AI cleanup)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "faster-whisper>=1.1",
    "sounddevice>=0.4.6",
    "pynput>=1.8",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
# NVIDIA runtime libraries for CTranslate2 (CUDA 12 / cuDNN 9) installed via pip,
# so no system-wide CUDA toolkit is required.
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
tray = ["pystray>=0.19", "Pillow>=10"]
claude = ["anthropic>=0.40"]
all = ["flow-dictation[cuda,tray,claude]"]
dev = ["pytest>=8"]

[project.scripts]
flow = "flow.cli:main"

[project.gui-scripts]
flow-bg = "flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flow = ["default_config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
